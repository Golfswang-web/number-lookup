<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Number Lookup</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f5f7fa; color: #1f2933;
  }
  .card {
    background: #fff; border: 1px solid #e1e5ea; border-radius: 10px;
    padding: 36px 40px; max-width: 440px; text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.05);
  }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p  { font-size: 14px; color: #52606d; margin: 0 0 24px; line-height: 1.5; }
  a.btn {
    display: inline-block; background: #0b6bcb; color: #fff; text-decoration: none;
    font-size: 15px; font-weight: 600; padding: 12px 26px; border-radius: 6px;
  }
  a.btn:hover { background: #0957a6; }
  .note { font-size: 12px; color: #9aa5b1; margin-top: 18px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Ported Number Lookup</h1>
    <p>Check which network a South African number is on using the porting.co.za number query (CRDB).</p>
    <a class="btn" href="https://www.porting.co.za/PublicWebsiteApp/#/number-inquiry"
       target="_blank" rel="noopener noreferrer">Open Number Lookup &#8599;</a>
    <div class="note">Opens in a new browser tab. The site can't be shown inside Zoho.</div>
  </div>
</body>
</html>
